<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="簡潔好用的線上擲骰子工具">
  <title>骰子工坊｜線上擲骰子</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <p class="eyebrow">ROLL THE MOMENT</p>
      <h1 id="page-title">骰子工坊</h1>
      <p class="intro">讓一個隨機數字，替你打開下一步。</p>
    </section>

    <section class="game-panel" aria-label="擲骰子控制區">
      <div class="panel-topline">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">準備好了</span>
        <span class="roll-count">已擲 <strong id="roll-count">0</strong> 次</span>
      </div>

      <div class="dice-stage">
        <div class="dice" id="dice" data-value="6" role="img" aria-label="骰子點數 6">
          <span class="pip pip-1"></span>
          <span class="pip pip-2"></span>
          <span class="pip pip-3"></span>
          <span class="pip pip-4"></span>
          <span class="pip pip-5"></span>
          <span class="pip pip-6"></span>
          <span class="pip pip-7"></span>
        </div>
      </div>

      <div class="result-area" aria-live="polite">
        <span class="result-label">本次點數</span>
        <strong id="result-number">6</strong>
      </div>

      <button class="roll-button" id="roll-button" type="button">
        <span class="button-icon" aria-hidden="true">↻</span>
        <span>擲骰子</span>
      </button>

      <p class="shortcut-hint">按下 <kbd>Space</kbd> 也可以擲骰子</p>
    </section>

    <section class="history-section" aria-labelledby="history-title">
      <div class="section-heading">
        <h2 id="history-title">最近紀錄</h2>
        <button class="clear-button" id="clear-button" type="button" disabled>清除</button>
      </div>
      <ol class="history-list" id="history-list">
        <li class="empty-state" id="empty-state">擲出第一顆骰子，紀錄會出現在這裡</li>
      </ol>
    </section>
  </main>

  <footer>每一次結果，都有剛好的驚喜。</footer>
  <script src="script.js"></script>
</body>
</html>
